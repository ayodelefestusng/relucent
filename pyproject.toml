[project]
name = "relucent-clothing"
version = "1.0.0"
description = "World-Class Luxury Fashion E-Commerce Platform for Relucent Clothing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "stripe>=14.0.0",
    "python-dotenv>=1.0.0",
    "django-import-export>=4.0.0",
    "gunicorn>=22.0.0",
    "psycopg[binary]>=3.1.0",
    "dj-database-url>=2.2.0",
    "whitenoise>=6.4.0",
    
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
