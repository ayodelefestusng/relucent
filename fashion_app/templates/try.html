<div class="row ">
    {% for product in products %}
   <div class="col-4 col-md-4 mr-10">
      <img class="thumbnail" src="{{product.product_image.url}}">
      <div class="box-element product">
        <h6><strong>{{product.product_name}}</strong></h6>
        <hr>
  
        <button data-product="{{product.id}}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">Add to Cart</button>
        
        <a class="btn btn-outline-success" href="#">View</a>
        <h4 style="display: inline-block; float: right"><strong>NGN{{product.selling_price}}</strong></h4>
  
      </div>
    </div>
    {% endfor %}
  </div>
