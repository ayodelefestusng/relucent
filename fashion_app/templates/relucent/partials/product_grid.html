<div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
    {% for product in products %}
        {% include 'relucent/partials/product_card.html' with product=product %}
    {% empty %}
        <div class="col-span-full py-20 text-center">
            <i data-lucide="sparkles" class="w-10 h-10 text-gold mx-auto stroke-1"></i>
            <h3 class="font-serif text-xl text-primary mt-3">No matching pieces found</h3>
            <p class="text-xs text-luxuryGray mt-1">Try adjusting your filters or browse our full luxury archives.</p>
            <a href="{% url 'product_list' %}" class="inline-block mt-4 px-6 py-2.5 bg-primary text-white text-xs uppercase tracking-widest hover:bg-gold transition-colors">
                Reset All Filters
            </a>
        </div>
    {% endfor %}
</div>
<script>
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
