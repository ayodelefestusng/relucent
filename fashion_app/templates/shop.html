<h1>Hello, world!</h1>

   
<div class=" Delivery Note container-fluid">
  <h1> Delivery Update  </h1>
</div>
<div class=" Delivery Note container-fluid">
  <div class="container text-center">
  
  </div>

</div>
<div class="row d-flex justify-content-center">
{% for i in product %}
<div class=" col-md-3 mx-1 mb-5 text-dark">
  <img class="thumbnail" src="{{i.product_image.url}}">
  <div class="box-element product">
    <h6><strong>{{i.name}}, {{i.id}}, {{i.price}} </strong></h6>
    <hr>

    <form class="btn btn-outline-secondary add-btn update-cart" action="{% url 'ordert'%}" method="post">
      {% csrf_token %}
        

      <input type="hidden"  name = 'product' id='product' value = {{i.name}} > 

      <input type="hidden"  name = 'price' id='price' value = {{i.price}} > 

      <button type="submit" class="btn btn-outline-secondary add-btn update-cart">Update Task</button>


    </form>

    <!-- <button data-product="{{product.id}}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">Add to Cart</button> -->
  
    <a class="btn btn-outline-success" href="#">View</a>
    <h5 style="display: inline-block; float: right"><strong>NGN{{i.price}}</strong></h5>

  </div>
 </div>
{% endfor %}
